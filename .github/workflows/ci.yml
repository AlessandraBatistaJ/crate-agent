name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore CrateAgent.Tests/CrateAgent.Tests.csproj

      - name: Compilar
        run: dotnet build CrateAgent.Tests/CrateAgent.Tests.csproj --no-restore -c Release

      - name: Rodar os testes
        run: dotnet test CrateAgent.Tests/CrateAgent.Tests.csproj --no-build -c Release --verbosity normal
